spring.datasource.url=jdbc:oracle:thin:@//192.168.1.67:1521/xe
spring.datasource.username=scott
spring.datasource.password=tiger
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# =========================
# MyBatis
# =========================
mybatis.mapper-locations=classpath:mapper/*.xml
mybatis.type-aliases-package=kr.co.seoulit.reception.dto
mybatis.configuration.map-underscore-to-camel-case=true

# =========================
# Logging
# =========================
logging.level.kr.co.seoulit.reception=info
logging.level.org.mybatis=info
logging.level.kr.co.seoulit.common=info
logging.level.org.hibernate.SQL=debug
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=trace

# =========================
# Redis
# =========================
spring.cache.type=none
spring.data.redis.host=localhost
spring.data.redis.port=6379

# =========================
# Swagger (Springdoc)
# =========================
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# =========================
# Uploads
# =========================
file.upload-dir=uploads

# =========================
# MinIO
# =========================
minio.endpoint=http://localhost:9000
minio.access-key=minioadmin
minio.secret-key=minioadmin
minio.bucket=reception-photos
# If you expose MinIO via a reverse proxy or public URL, set it here.
