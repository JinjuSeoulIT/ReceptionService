# src/main/resources/application.properties

server.port=8283

# =========================
# JPA
# =========================
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.community.dialect.Oracle10gDialect

# =========================

#spring.datasource.url=jdbc:mysql://localhost:3306/hospital_reception
##spring.datasource.url=jdbc:mysql://db:3306/hospital_reception
#spring.datasource.url=jdbc:mysql://localhost:3306/hospital_reception?createDatabaseIfNotExist=true&serverTimezone=Asia/Seoul&useUnicode=true&characterEncoding=UTF-8&connectionCollation=utf8mb4_unicode_ci&useSSL=false&allowPublicKeyRetrieval=true
#spring.datasource.username=root
